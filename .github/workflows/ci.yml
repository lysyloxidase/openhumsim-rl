name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Run full test suite
        run: python -m pytest -q -ra -W error

  scientific-validation:
    name: Scientific integrity gate · v0.23.2
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Verify committed release evidence when present
        run: |
          if test -f RELEASE_v0.23.2.json; then
            python validation/verify_release_evidence.py
          fi

      - name: Run v0.23.2 integrity gate
        run: python validation/run_validation_v0232.py

  package:
    name: Build and smoke-test package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install wheel in an isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/openhumsim-smoke"
          "$RUNNER_TEMP/openhumsim-smoke/bin/python" -m pip install dist/*.whl

      - name: Smoke-test installed CLI outside the source tree
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/openhumsim-smoke/bin/openhumsim" --version
          "$RUNNER_TEMP/openhumsim-smoke/bin/openhumsim" doctor
          "$RUNNER_TEMP/openhumsim-smoke/bin/openhumsim" demo --scenario baseline --minutes 5 --seed 42
          "$RUNNER_TEMP/openhumsim-smoke/bin/openhumsim" dashboard --help
          "$RUNNER_TEMP/openhumsim-smoke/bin/python" -m openhumsim_rl.dashboard_server --help
          "$RUNNER_TEMP/openhumsim-smoke/bin/python" -c 'from importlib.resources import files; page = files("openhumsim_rl").joinpath("dashboard", "index.html"); assert "RESEARCH SOFTWARE ONLY" in page.read_text(encoding="utf-8")'
          if "$RUNNER_TEMP/openhumsim-smoke/bin/openhumsim" validate --scientific-only 2> validate-error.txt; then
            echo "installed wheel unexpectedly found checkout-only validation assets" >&2
            exit 1
          fi
          grep -Fq "requires a source checkout" validate-error.txt
