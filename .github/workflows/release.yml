name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  attestations: write
  contents: read
  id-token: write

jobs:
  build-and-release:
    name: Build and attest release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Verify tag matches package version
        run: |
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "v$package_version"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Smoke-test wheel outside the source tree
        run: |
          python -m venv "$RUNNER_TEMP/openhumsim-release-smoke"
          "$RUNNER_TEMP/openhumsim-release-smoke/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/openhumsim-release-smoke/bin/openhumsim" --version
          "$RUNNER_TEMP/openhumsim-release-smoke/bin/openhumsim" demo --scenario baseline --minutes 5 --seed 42
          if "$RUNNER_TEMP/openhumsim-release-smoke/bin/openhumsim" validate --scientific-only 2> validate-error.txt; then
            echo "installed wheel unexpectedly found checkout-only validation assets" >&2
            exit 1
          fi
          grep -Fq "requires a source checkout" validate-error.txt

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum -- *.whl *.tar.gz > SHA256SUMS

      - name: Preserve workflow artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openhumsim-rl-${{ github.ref_name }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

      - name: Attest release provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
